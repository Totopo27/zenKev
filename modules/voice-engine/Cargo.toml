[package]
name = "zen-voice-engine"
version = "0.1.0"
edition = "2021"
authors = ["Zen Voice Navigator Team"]
description = "Demonio nativo de baja latencia para Zen Voice Navigator (VAD, STT, Pre-ranking léxico y NLI)"

[dependencies]
# Serialización IPC ultrarrápida y tipada
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Runtime asíncrono para IPC y eventos
tokio = { version = "1.40", features = ["full"] }

# Asignador de memoria de alto rendimiento (Sección 14 del catálogo: reduce 15-30% RAM y evita contención en Windows HeapAlloc)
mimalloc = { version = "0.1", default-features = false }

# Motor de similitud léxica sub-1ms (Trigram matching / Levenshtein / Token similarity)
strsim = "0.11"

# Logs y diagnóstico
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Manejo de errores
thiserror = "1.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
